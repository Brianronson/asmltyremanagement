<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASML Tyre Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#F5F7F6;
  --ink:#16201B; --ink-2:#4A5A51; --ink-3:#86938C; --line:#D4DBD7; --line-2:#E6EBE8;
  --accent:#1E6B3C; --accent-ink:#FFFFFF; --accent-soft:#E2F0E7;
  --good:#2E8B57; --monitor:#D9A400; --soon:#E0702B; --replace:#C0392B; --empty:#CBD3CF;
  --warn-bg:#FFF3E0; --warn-ink:#8A4B00; --danger-bg:#FDECEA; --danger-ink:#8E1B12;
  --diagram-body:#DADFDC; --diagram-glass:#B9C6D9; --diagram-axle:#9AA5A0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121715; --surface:#1A211E; --surface-2:#212925;
    --ink:#E9EEEB; --ink-2:#AFBAB4; --ink-3:#73807A; --line:#2E3934; --line-2:#27312C;
    --accent:#5CC287; --accent-ink:#0D1A12; --accent-soft:#1D3326;
    --good:#3FA86B; --monitor:#E0B22B; --soon:#EF8A4A; --replace:#E05548; --empty:#3A4540;
    --warn-bg:#3A2A10; --warn-ink:#F2C27B; --danger-bg:#3D1A17; --danger-ink:#F4A39B;
    --diagram-body:#2B3430; --diagram-glass:#3C4A5C; --diagram-axle:#4A5651;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121715; --surface:#1A211E; --surface-2:#212925;
  --ink:#E9EEEB; --ink-2:#AFBAB4; --ink-3:#73807A; --line:#2E3934; --line-2:#27312C;
  --accent:#5CC287; --accent-ink:#0D1A12; --accent-soft:#1D3326;
  --good:#3FA86B; --monitor:#E0B22B; --soon:#EF8A4A; --replace:#E05548; --empty:#3A4540;
  --warn-bg:#3A2A10; --warn-ink:#F2C27B; --danger-bg:#3D1A17; --danger-ink:#F4A39B;
  --diagram-body:#2B3430; --diagram-glass:#3C4A5C; --diagram-axle:#4A5651;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:Barlow,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;height:54px}
.brand{font-weight:700;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand .mark{width:22px;height:22px;border-radius:50%;background:var(--ink);position:relative;flex:none}
.brand .mark::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.storepill{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.storepill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.storepill.shared .dot{background:var(--good)} .storepill.local .dot{background:var(--monitor)} .storepill.offline .dot{background:var(--soon)}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.view{display:none} .view.on{display:block}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.viewhead .sub{color:var(--ink-2);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--replace);border-color:var(--replace)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* stats row */
.stats{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.stat{padding:12px 20px 12px 0;margin-right:20px;border-right:1px solid var(--line-2)}
.stat:last-child{border-right:0}
.stat .n{font-size:24px;font-weight:600;line-height:1.1}
.stat .l{color:var(--ink-2);font-size:13px}
.stat.warn .n{color:var(--soon)} .stat.bad .n{color:var(--replace)}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
th{font-weight:600;font-size:13px;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
td .small{display:block;color:var(--ink-3);font-size:12.5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;line-height:1.5;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.badge.monitor{color:#8A6A00;background:color-mix(in srgb,var(--monitor) 20%,transparent)}
.badge.soon{color:var(--soon);background:color-mix(in srgb,var(--soon) 15%,transparent)}
.badge.replace{color:var(--replace);background:color-mix(in srgb,var(--replace) 14%,transparent)}
.badge.unrecorded{color:var(--ink-3);background:var(--surface-2)}
.badge.removed{color:var(--ink-3);background:var(--surface-2)}
.badge.warn{color:var(--warn-ink);background:var(--warn-bg)}
.badge.danger{color:var(--danger-ink);background:var(--danger-bg)}
.badge.plain::before{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .badge.monitor{color:var(--monitor)} }
:root[data-theme="dark"] .badge.monitor{color:var(--monitor)}

/* pickers + inspect */
.pickers{display:grid;grid-template-columns:200px 1fr;gap:10px;margin-bottom:16px;max-width:620px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--ink-3)}
.inspect{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:22px;align-items:start}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px 10px}
.diagram svg{width:100%;height:auto;display:block}
.diagram .vname{font-weight:600;font-size:16px;padding:0 6px 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.diagram .vname span{color:var(--ink-3);font-weight:400;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 6px 2px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.legend i.empty{background:transparent;border:1.5px dashed var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-height:200px}
.panel h2{margin-bottom:4px}
.panel .muted{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:12px 0 4px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.wearbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:6px 0 2px}
.wearbar i{display:block;height:100%;border-radius:4px}
.bigwear{font-size:30px;font-weight:600;line-height:1;margin-top:10px}
.bigwear small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:6px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.formgrid .span2{grid-column:1/-1}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.form-actions .left{margin-right:auto}
.hist{margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
.hist table{min-width:0}
.hist th,.hist td{padding:6px 8px;font-size:13px}
.emptystate{color:var(--ink-2);padding:30px 10px;text-align:center}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.notice.warn{background:var(--warn-bg);color:var(--warn-ink)}
.notice.danger{background:var(--danger-bg);color:var(--danger-ink)}
.notice.info{background:var(--accent-soft);color:var(--accent)}

/* diagram svg classes */
.body{fill:var(--diagram-body)} .glass{fill:var(--diagram-glass)}
.axle{stroke:var(--diagram-axle);stroke-width:5;stroke-linecap:round}
.hitch{stroke:var(--diagram-axle);stroke-width:3} .hitch-c{fill:var(--diagram-axle)}
.axlab{fill:var(--ink-3);font-size:11px;font-weight:500}
.tyre{cursor:pointer} .tyre rect{stroke:transparent;stroke-width:0;transition:stroke-width .08s}
.tyre .tread line{stroke:rgba(0,0,0,.38);stroke-width:2}
.tyre.empty rect{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:4 3}
.tyre.empty .tread{display:none}
.tyre:hover rect,.tyre:focus-visible rect{stroke:var(--ink);stroke-width:2;stroke-dasharray:0}
.tyre.sel rect{stroke:var(--accent);stroke-width:3.5;stroke-dasharray:0}
.tyre:focus-visible{outline:none}
.tyre.ghost{opacity:.45;cursor:default}
.poslab{fill:var(--ink);font-size:9px;font-weight:600;pointer-events:none}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,14,12,.5)}
.dlg{padding:22px 24px}
.dlg h2{margin-bottom:14px}
.alertgroup{margin-bottom:26px}
.alertgroup h2{margin-bottom:10px;display:flex;align-items:center;gap:10px}
.alertgroup h2 .count{font-size:13px;color:var(--ink-3);font-weight:500}
.alertlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.alertrow{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.alertrow:last-child{border-bottom:0} .alertrow:hover{background:var(--surface-2)}
.alertrow .main{flex:1;min-width:0}
.alertrow .main .small{color:var(--ink-3);font-size:13px}
.preview{font-size:12.5px;max-height:160px;overflow:auto;border:1px solid var(--line-2);border-radius:8px;margin-top:8px}
.preview table{min-width:0}
.preview th,.preview td{padding:4px 8px}

@media (max-width:820px){
  .top{padding:0 12px;gap:10px} .brand{font-size:15px}
  main{padding:14px 12px 50px}
  .inspect{grid-template-columns:1fr}
  .pickers{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  .stat{padding-right:14px;margin-right:14px}
  .storepill span.t{display:none}
  .brand .txt{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="mark"></span><span class="txt">ASML tyre register</span></div>
  <nav class="tabs" id="tabs">
    <button data-view="fleet" aria-current="page">Fleet</button>
    <button data-view="inspect">Inspect</button>
    <button data-view="register">Tyres</button>
    <button data-view="alerts">Alerts</button>
  </nav>
  <div class="storepill" id="storepill"><span class="dot"></span><span class="t">Connecting…</span></div>
</header>

<main id="main">
  <section class="view on" id="view-fleet"></section>
  <section class="view" id="view-inspect"></section>
  <section class="view" id="view-register"></section>
  <section class="view" id="view-alerts"></section>
</main>

<dialog id="modal"></dialog>

<script>
/* =========================================================
   Vehicle types and wheel layouts
   ========================================================= */
const TYPES = {
  prime_mover:{ label:'Prime mover',
    head:[ {label:'Steer',dual:false}, {label:'Drive 1',dual:true}, {label:'Drive 2',dual:true} ],
    trailer:{ label:'Trailer', def:3, min:1, max:4 }, spare:true,
    newDepth:18, minDepth:3, size:'295/80 R22.5', pressure:'110' },
  tractor:{ label:'Tractor',
    head:[ {label:'Front',dual:false,scale:.85}, {label:'Rear',dual:false,scale:1.5} ],
    trailer:{ label:'Trailer', def:1, min:1, max:2 }, spare:false,
    newDepth:40, minDepth:8, size:'', pressure:'' },
  pickup:{ label:'Pickup',
    head:[ {label:'Front',dual:false}, {label:'Rear',dual:false} ],
    trailer:null, spare:true, newDepth:9, minDepth:1.6, size:'', pressure:'35' },
  light:{ label:'Light vehicle',
    head:[ {label:'Front',dual:false}, {label:'Rear',dual:false} ],
    trailer:null, spare:true, newDepth:8, minDepth:1.6, size:'', pressure:'32' },
  loader:{ label:'Wheel loader',
    head:[ {label:'Front',dual:false,scale:1.7}, {label:'Rear',dual:false,scale:1.7} ],
    trailer:null, spare:false, newDepth:45, minDepth:10, size:'23.5-25', pressure:'' },
  grader:{ label:'Motor grader',
    head:[ {label:'Front',dual:false,scale:1.25}, {label:'Tandem 1',dual:false,scale:1.25}, {label:'Tandem 2',dual:false,scale:1.25} ],
    trailer:null, spare:false, newDepth:35, minDepth:8, size:'17.5-25', pressure:'' },
  tracked:{ label:'Tracked plant (no tyres)',
    head:[], trailer:null, spare:false, newDepth:0, minDepth:0, size:'', pressure:'' },
};
const TYPE_ORDER = ['prime_mover','tractor','loader','grader','pickup','light','tracked'];
const SIDE = { L:'left', R:'right', LO:'left outer', LI:'left inner', RI:'right inner', RO:'right outer' };
const STATUS = {
  good:{label:'Good',color:'var(--good)'},
  monitor:{label:'Monitor',color:'var(--monitor)'},
  soon:{label:'Replace soon',color:'var(--soon)'},
  replace:{label:'Replace now',color:'var(--replace)'},
  unrecorded:{label:'Not recorded',color:'var(--empty)'},
  removed:{label:'Removed',color:'var(--empty)'},
};
const CONDITIONS = ['Normal','Uneven wear','Cuts / chunking','Sidewall damage','Bulge','Low pressure','Retread lifting','Other'];
const STATIONARY_DAYS = 7;

/* =========================================================
   Utilities
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n,d=0) => (n==null || n==='' || isNaN(+n)) ? '—' : (+n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const num = v => (v===''||v==null) ? null : (isNaN(+v) ? null : +v);
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const daysBetween = (a,b) => { const x=new Date(a), y=new Date(b); if(isNaN(x)||isNaN(y)) return null; return Math.round((y-x)/86400000); };
const daysAgo = iso => iso ? daysBetween(iso, new Date().toISOString()) : null;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const parseTrackerDate = s => { if(!s) return null; const str=String(s).trim(); let d=new Date(str.replace(' ','T')); if(isNaN(d)) d=new Date(str); return isNaN(d)?null:d.toISOString(); };
const typeLabel = t => TYPES[t] ? TYPES[t].label : 'Type not set';
const sortBy = (arr, f) => arr.slice().sort((a,b)=> (f(a)>f(b)?1:f(a)<f(b)?-1:0));

/* =========================================================
   Positions and diagram
   ========================================================= */
function positionsFor(v){
  const T = TYPES[v.type]; if(!T) return [];
  const out = [];
  T.head.forEach((ax,i)=>{
    const a=i+1;
    (ax.dual?['LO','LI','RI','RO']:['L','R']).forEach(s=>out.push({id:`H${a}${s}`,group:'head',axle:a,side:s,label:`${ax.label} ${SIDE[s]}`}));
  });
  if(T.trailer){
    const n = clamp(+v.trailerAxles || T.trailer.def, T.trailer.min, T.trailer.max);
    for(let a=1;a<=n;a++) ['LO','LI','RI','RO'].forEach(s=>out.push({id:`T${a}${s}`,group:'trailer',axle:a,side:s,label:`Trailer axle ${a} ${SIDE[s]}`}));
  }
  if(T.spare && v.hasSpare!==false) out.push({id:'SP',group:'spare',label:'Spare'});
  return out;
}

function tyreGlyph(pos, x, y, w, h, t, selected, ghost){
  const st = t ? statusOf(t) : 'empty';
  const fill = st==='empty' ? '' : `fill="${STATUS[st].color}"`;
  const cls = 'tyre'+(selected?' sel':'')+(st==='empty'?' empty':'')+(ghost?' ghost':'');
  let treads=''; for(let i=1;i<5;i++){ const ty=(y+h*i/5).toFixed(1); treads+=`<line x1="${x+5}" y1="${ty}" x2="${x+w-5}" y2="${ty}"/>`; }
  const title = esc(pos.label)+(t?` — ${esc(t.serial||'no serial')}, ${STATUS[st].label}`:' — empty');
  const short = pos.id==='SP' ? 'SP' : pos.id.replace(/^H/,'').replace(/^T/,'T');
  return `<g class="${cls}" data-pos="${pos.id}" tabindex="${ghost?-1:0}" role="button" aria-label="${title}"><title>${title}</title>`+
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(9,w/3).toFixed(1)}" ${fill}/>`+
    `<g class="tread">${treads}</g>`+
    `<text class="poslab" x="${x+w/2}" y="${y+h+11}" text-anchor="middle">${short}</text></g>`;
}

function diagramSVG(v, tyreByPos, selected, ghost){
  const T = TYPES[v.type]; if(!T) return '';
  const W=380, cx=W/2, bodyW=116;
  const SW=28, SH=54, DW=24, GAP=7, OFF=8;
  const parts=[], tyres=[];
  let y=22;

  function axleRow(yc, dual, scale, group, axleNo){
    const w = dual?DW:Math.round(SW*scale), h = Math.round(SH*scale);
    const xs = [];
    if(dual){
      const lo = cx-bodyW/2-OFF-DW-GAP-DW, li = cx-bodyW/2-OFF-DW;
      const ri = cx+bodyW/2+OFF, ro = cx+bodyW/2+OFF+DW+GAP;
      xs.push(['LO',lo],['LI',li],['RI',ri],['RO',ro]);
    } else {
      xs.push(['L',cx-bodyW/2-OFF-w],['R',cx+bodyW/2+OFF]);
    }
    const x1 = xs[0][1]+w/2, x2 = xs[xs.length-1][1]+w/2;
    parts.push(`<line class="axle" x1="${x1}" y1="${yc}" x2="${x2}" y2="${yc}"/>`);
    xs.forEach(([s,x])=>{
      const id = `${group==='head'?'H':'T'}${axleNo}${s}`;
      const pos = {id, label: group==='head' ? `${T.head[axleNo-1].label} ${SIDE[s]}` : `Trailer axle ${axleNo} ${SIDE[s]}`};
      tyres.push(tyreGlyph(pos, x, yc-h/2, w, h, tyreByPos[id], selected===id, ghost));
    });
    return h;
  }

  // head unit
  const headTop=y;
  const headRows=[];
  T.head.forEach((ax,i)=>{ const sc=ax.scale||1; const h=Math.round(SH*sc); const yc=y+h/2+14; headRows.push({ax,yc,sc,i:i+1}); y=yc+h/2+22; });
  const headBottom=y;
  parts.push(`<rect class="body" x="${cx-bodyW/2}" y="${headTop}" width="${bodyW}" height="${headBottom-headTop}" rx="16"/>`);
  parts.push(`<rect class="glass" x="${cx-bodyW/2+14}" y="${headTop+10}" width="${bodyW-28}" height="16" rx="5"/>`);
  headRows.forEach(r=>{ axleRow(r.yc, r.ax.dual, r.sc, 'head', r.i); parts.push(`<text class="axlab" x="6" y="${r.yc+4}">${esc(r.ax.label)}</text>`); });

  // trailer
  if(T.trailer){
    const n = clamp(+v.trailerAxles || T.trailer.def, T.trailer.min, T.trailer.max);
    const gapTop = y; y += 34;
    parts.push(`<line class="hitch" x1="${cx}" y1="${gapTop}" x2="${cx}" y2="${y}"/><circle class="hitch-c" cx="${cx}" cy="${gapTop+17}" r="5"/>`);
    const trTop=y;
    const trRows=[];
    for(let a=1;a<=n;a++){ const yc=y+SH/2+12; trRows.push({a,yc}); y=yc+SH/2+22; }
    const trBottom=y;
    parts.push(`<rect class="body" x="${cx-bodyW/2}" y="${trTop}" width="${bodyW}" height="${trBottom-trTop}" rx="10"/>`);
    trRows.forEach(r=>{ axleRow(r.yc, true, 1, 'trailer', r.a); parts.push(`<text class="axlab" x="6" y="${r.yc+4}">Trailer ${r.a}</text>`); });
  }

  // spare
  if(T.spare && v.hasSpare!==false){
    const yc = y + SH/2 + 6;
    parts.push(`<text class="axlab" x="6" y="${yc+4}">Spare</text>`);
    tyres.push(tyreGlyph({id:'SP',label:'Spare'}, cx-SW/2, yc-SH/2, SW, SH, tyreByPos['SP'], selected==='SP', ghost));
    y = yc + SH/2 + 20;
  }
  const H = y + 8;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Wheel positions">${parts.join('')}${tyres.join('')}</svg>`;
}

/* =========================================================
   Tyre maths
   ========================================================= */
function wearOf(t){
  const nd=num(t.newDepth), md=num(t.minDepth), cd=num(t.lastDepth);
  if(nd==null||md==null||cd==null||!(nd>md)) return null;
  return clamp((nd-cd)/(nd-md)*100, 0, 150);
}
function statusOf(t){
  if(t.status && t.status!=='fitted') return 'removed';
  const w = wearOf(t); if(w==null) return 'unrecorded';
  if(w>=100 || num(t.lastDepth)<=num(t.minDepth)) return 'replace';
  if(w>=75) return 'soon';
  if(w>=50) return 'monitor';
  return 'good';
}
function kmRun(t, v){
  if(t.status!=='fitted') return num(t.totalKm);
  if(!v || num(v.odometer)==null || num(t.fittedOdo)==null) return null;
  return Math.max(0, v.odometer - t.fittedOdo);
}
function remainingKm(t, v){
  const w=wearOf(t), km=kmRun(t,v);
  if(w==null || km==null || w<=0 || km<=0) return null;
  return Math.max(0, km*(100-w)/w);
}
function costPerKm(t, v){ const km=kmRun(t,v); const c=num(t.cost); if(c==null||km==null||km<1) return null; return c/km; }

/* =========================================================
   Vehicle activity
   ========================================================= */
function daysSinceActive(v){ return v.lastActive ? daysAgo(v.lastActive) : null; }
function standingDays(v){
  if(v.moveState==='standing' && v.moveSince){ const d=daysAgo(v.moveSince); if(d!=null) return d; }
  return null;
}
function stationaryDays(v){
  const sd=standingDays(v); if(sd!=null) return sd;
  const h = Array.isArray(v.odoHistory)? v.odoHistory : [];
  if(h.length<2) return null;
  const last=h[h.length-1]; let i=h.length-1;
  while(i>0 && Math.abs((+h[i-1].o)-(+last.o))<0.5) i--;
  return daysBetween(h[i].d, last.d);
}
function vehicleAlerts(v){
  const a=[];
  const ds=daysSinceActive(v), st=stationaryDays(v);
  if(ds!=null && ds>=STATIONARY_DAYS) a.push({k:'inactive', text:`No tracker update for ${ds} days`});
  if(st!=null && st>=STATIONARY_DAYS) a.push({k:'stationary', text: standingDays(v)!=null ? `Standing still for ${st} days (tracker)` : `Odometer unchanged for ${st} days`});
  if(!TYPES[v.type]) a.push({k:'notype', text:'Vehicle type not set'});
  return a;
}
function pushOdoHistory(v, km, dateISO){
  const d=(dateISO||new Date().toISOString()).slice(0,10);
  const h = Array.isArray(v.odoHistory)? v.odoHistory.slice() : [];
  if(h.length && h[h.length-1].d===d){ h[h.length-1]={d,o:km}; } else h.push({d,o:km});
  v.odoHistory = h.slice(-120);
}

/* =========================================================
   Config — paste your Apps Script web app URL (ends in /exec) and
   the API_TOKEN you set in Script properties. Leave blank to be
   asked for them in the tool instead (they are then kept on the device).
   ========================================================= */
const CONFIG = {
  API_URL: '',
  API_TOKEN: '',
  REFRESH_SECONDS: 60,
};

/* =========================================================
   Store: Google Sheets via Apps Script, with local fallback
   ========================================================= */
const store = {
  mode:'connecting', vehicles:new Map(), tyres:new Map(), settings:{}, lastSync:null, noToken:false, readOnly:false,
  apiUrl:'', token:'', connected:false, syncing:false, timer:null, listeners:false,
  async init(){
    this.apiUrl = (CONFIG.API_URL || localStorage.getItem('asml_api_url') || '').trim();
    this.token  = (CONFIG.API_TOKEN || localStorage.getItem('asml_api_token') || '').trim();
    this.loadLocal();
    if(!this.apiUrl){ this.mode='local'; this.connected=false; setPill(); render(); return; }
    this.mode='connecting'; setPill(); render();
    await this.refresh(true);
    if(this.timer) clearInterval(this.timer);
    this.timer=setInterval(()=>this.refresh(false), Math.max(15, CONFIG.REFRESH_SECONDS)*1000);
    if(!this.listeners){ this.listeners=true; document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && this.apiUrl) this.refresh(false); }); }
  },
  async api(params, body){
    const u = new URL(this.apiUrl);
    if(params) Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
    let opts;
    if(body){ opts={method:'POST', body:JSON.stringify({...body, token:this.token}), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow'}; }
    else { if(this.token) u.searchParams.set('token', this.token); opts={method:'GET', redirect:'follow'}; }
    const r = await fetch(u.toString(), opts);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'Request failed');
    return j;
  },
  async refresh(first){
    try{
      const r = await this.api({action:'all'});
      this.vehicles=new Map((r.vehicles||[]).map(v=>[v.id,v]));
      this.tyres=new Map((r.tyres||[]).map(t=>[t.id,t]));
      this.settings=r.settings||{}; this.lastSync=r.lastSync||null; this.noToken=!!r.noToken;
      this.connected=true; this.mode='shared'; this.saveLocal(); setPill(); safeRender();
    }catch(e){
      if(first){ this.mode='local'; this.connected=false; notice('Couldn’t reach the register ('+e.message+'). Showing the last copy saved on this device.','warn'); }
      else { this.mode='offline'; }
      setPill(); safeRender();
    }
  },
  loadLocal(){
    try{ const raw=localStorage.getItem('asml_tyres_v1'); if(raw){ const o=JSON.parse(raw); this.vehicles=new Map((o.vehicles||[]).map(v=>[v.id,v])); this.tyres=new Map((o.tyres||[]).map(t=>[t.id,t])); this.settings=o.settings||{}; this.lastSync=o.lastSync||null; } }catch(e){}
  },
  saveLocal(){
    try{ localStorage.setItem('asml_tyres_v1', JSON.stringify({vehicles:[...this.vehicles.values()],tyres:[...this.tyres.values()],settings:this.settings,lastSync:this.lastSync})); }catch(e){}
  },
  async write(col, obj){
    obj.updatedAt=new Date().toISOString();
    const map = col==='vehicles'?this.vehicles:this.tyres;
    map.set(obj.id, obj); this.saveLocal(); render();
    if(this.connected){ try{ await this.api(null,{action:'save',col,data:obj}); }catch(e){ notice('That change couldn’t be saved to the register: '+e.message,'danger'); } }
  },
  async bulkWrite(col, items){
    const map = col==='vehicles'?this.vehicles:this.tyres;
    const now=new Date().toISOString();
    items.forEach(o=>{ o.updatedAt=now; map.set(o.id,o); });
    this.saveLocal(); render();
    if(this.connected){ try{ await this.api(null,{action:'bulkSave',col,items}); }catch(e){ notice('The import couldn’t be saved to the register: '+e.message,'danger'); } }
  },
  async remove(col, id){
    const map = col==='vehicles'?this.vehicles:this.tyres;
    map.delete(id); this.saveLocal(); render();
    if(this.connected){ try{ await this.api(null,{action:'delete',col,id}); }catch(e){ notice('That deletion couldn’t be saved to the register: '+e.message,'danger'); } }
  },
  async saveSettings(sv){
    this.settings={...this.settings,...sv}; this.saveLocal();
    if(this.connected){ try{ await this.api(null,{action:'settings',data:sv}); }catch(e){} }
  },
  async syncNow(){
    if(!this.connected){ notice('Connect to the register first, then sync from the tracker.','warn'); return; }
    if(this.syncing) return;
    this.syncing=true; render();
    try{
      const r=await this.api({action:'sync'});
      await this.refresh(false);
      notice(`Tracker sync done: ${r.devices} vehicles, ${r.added} new, ${r.updated} updated`+(r.canOdometers!=null?` · ${r.canOdometers} with a CAN odometer, the rest GPS`:''),'info');
    }catch(e){ notice('Tracker sync failed: '+e.message,'danger'); }
    finally{ this.syncing=false; render(); }
  },
  connect(url, token){
    try{ localStorage.setItem('asml_api_url', url); localStorage.setItem('asml_api_token', token||''); }catch(e){}
    this.init();
  },
  disconnect(){
    try{ localStorage.removeItem('asml_api_url'); localStorage.removeItem('asml_api_token'); }catch(e){}
    if(this.timer) clearInterval(this.timer); this.timer=null; this.apiUrl=''; this.token=''; this.connected=false; this.mode='local'; setPill(); render();
  }
};

function setPill(){
  const p=$('#storepill'); const t=p.querySelector('.t');
  p.className='storepill';
  if(store.mode==='shared'){ p.classList.add('shared'); t.textContent='Connected'; }
  else if(store.mode==='offline'){ p.classList.add('offline'); t.textContent='Offline — last loaded data'; }
  else if(store.mode==='local'){ p.classList.add('local'); t.textContent=store.apiUrl?'Not connected':'This device only'; }
  else t.textContent='Connecting…';
}
let pendingRender=false;
function safeRender(){ if((typeof modal!=='undefined' && modal.open) || $('#form-fit')){ pendingRender=true; return; } render(); }
function ago(iso){ const m=Math.round((Date.now()-new Date(iso))/60000); if(isNaN(m)) return ''; if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<48) return h+' h ago'; return Math.round(h/24)+' days ago'; }
let noticeMsg=null;
function notice(text,kind){ noticeMsg={text,kind}; render(); setTimeout(()=>{ if(noticeMsg&&noticeMsg.text===text){ noticeMsg=null; render(); } }, 9000); }

/* =========================================================
   App state + render
   ========================================================= */
const state = { view:'fleet', type:'', vehicleId:'', pos:'', regFilter:'all', fleetSort:'name' };
const tyresOf = vid => [...store.tyres.values()].filter(t=>t.status==='fitted' && t.vehicleId===vid);
const tyreMapOf = vid => Object.fromEntries(tyresOf(vid).map(t=>[t.position,t]));
const worstStatus = list => ['replace','soon','monitor','good','unrecorded'].find(s=>list.some(t=>statusOf(t)===s)) || null;
const vehiclesSorted = () => sortBy([...store.vehicles.values()], v=>(v.name||'').toLowerCase());

function render(){
  pendingRender=false;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='view-'+state.view));
  document.querySelectorAll('#tabs button').forEach(b=>{ if(b.dataset.view===state.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const n = noticeMsg ? `<div class="notice ${noticeMsg.kind}">${esc(noticeMsg.text)}</div>` : '';
  if(state.view==='fleet') $('#view-fleet').innerHTML = n + renderFleet();
  if(state.view==='inspect') $('#view-inspect').innerHTML = n + renderInspect();
  if(state.view==='register') $('#view-register').innerHTML = n + renderRegister();
  if(state.view==='alerts') $('#view-alerts').innerHTML = n + renderAlerts();
}

/* ---------- Fleet ---------- */
function connectPanel(){
  if(store.connected){
    return store.noToken ? `<div class="notice warn">The Apps Script has no API_TOKEN set, so anyone with its URL can change this register. Add one under Project Settings → Script properties, then enter it here by reconnecting.</div>` : '';
  }
  if(store.mode==='connecting') return '';
  if(store.mode==='offline') return `<div class="notice warn">Can’t reach the register right now — showing the last data loaded. Changes are kept on this device and may not reach the shared register.</div>`;
  const u=store.apiUrl, t=store.token;
  return `<div class="notice info" style="padding:14px 16px">
    <strong>${u?'Couldn’t connect to the register.':'Connect this tool to your register.'}</strong>
    <span class="muted"> ${u?'Check the URL and token below.':'Paste the Apps Script web-app URL (ends in /exec) and the API token from setup. They stay on this device.'}</span>
    <form id="form-connect" class="formgrid" style="margin-top:10px">
      <div class="field"><label>Web app URL</label><input name="url" required placeholder="https://script.google.com/macros/s/…/exec" value="${esc(u)}"></div>
      <div class="field"><label>API token</label><input name="token" placeholder="as set in Script properties" value="${esc(t)}"></div>
      <div class="span2" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary">Connect</button>${u?`<button type="button" class="btn" id="btn-disconnect">Work on this device only</button>`:''}</div>
    </form></div>`;
}
function renderFleet(){
  const vs = vehiclesSorted();
  const allT=[...store.tyres.values()].filter(t=>t.status==='fitted');
  const replace=allT.filter(t=>statusOf(t)==='replace').length;
  const soon=allT.filter(t=>statusOf(t)==='soon').length;
  const stationary=vs.filter(v=>vehicleAlerts(v).some(a=>a.k!=='notype')).length;
  const unrec = vs.reduce((s,v)=> s + Math.max(0, positionsFor(v).length - tyresOf(v.id).length), 0);
  const ro = store.readOnly;
  let rows = vs.map(v=>{
    const ts=tyresOf(v.id), ps=positionsFor(v), worst=worstStatus(ts);
    const al=vehicleAlerts(v);
    const ds=daysSinceActive(v);
    return `<tr class="click" data-open="${esc(v.id)}">
      <td><strong>${esc(v.name||'—')}</strong>${v.plate&&v.plate!==v.name?`<span class="small">${esc(v.plate)}</span>`:''}</td>
      <td>${esc(typeLabel(v.type))}</td>
      <td>${esc([v.brand,v.model].filter(Boolean).join(' ')||'—')}</td>
      <td class="num">${fmt(v.odometer)}${v.odoSource?`<span class="small">${v.odoSource==='can'?'CAN':'GPS'}</span>`:''}</td>
      <td>${v.lastActive?esc(v.lastActive.slice(0,10)):'—'}${ds!=null?`<span class="small">${ds===0?'today':ds===1?'1 day ago':ds+' days ago'}</span>`:''}</td>
      <td>${al.map(a=>`<span class="badge ${a.k==='notype'?'warn':'danger'} plain">${esc(a.k==='notype'?'No type':a.k==='inactive'?`Inactive ${ds}d`:'Stationary '+stationaryDays(v)+'d')}</span>`).join(' ')||''}</td>
      <td class="num">${ts.length} / ${ps.length||'—'}</td>
      <td>${worst?`<span class="badge ${worst}">${STATUS[worst].label}</span>`:(ps.length?'<span class="badge unrecorded">Not recorded</span>':'<span class="muted">No tyres</span>')}</td>
      <td><button class="btn sm" data-inspect="${esc(v.id)}">Inspect</button> ${ro?'':`<button class="btn sm" data-edit="${esc(v.id)}">Edit</button>`}</td>
    </tr>`;
  }).join('');
  if(!vs.length) rows=`<tr><td colspan="9"><div class="emptystate">No vehicles yet. Connect to the register and press Sync from tracker to load the whole fleet with odometers, or add vehicles by hand.</div></td></tr>`;
  return `${connectPanel()}
  <div class="viewhead">
    <div><h1>Fleet</h1><p class="sub">${vs.length} vehicle${vs.length===1?'':'s'}, ${allT.length} tyres fitted${store.lastSync?` · tracker synced ${ago(store.lastSync)}`:''}</p></div>
    <div class="actions">
      ${store.connected?`<button class="btn primary" id="btn-sync" ${store.syncing?'disabled':''}>${store.syncing?'Syncing…':'Sync from tracker'}</button>`:''}
      <button class="btn ${store.connected?'':'primary'}" id="btn-add-vehicle">Add vehicle</button>
      <button class="btn" id="btn-export-fleet">Export CSV</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n">${vs.length}</div><div class="l">Vehicles</div></div>
    <div class="stat ${stationary?'warn':''}"><div class="n">${stationary}</div><div class="l">Inactive or stationary ${STATIONARY_DAYS}+ days</div></div>
    <div class="stat ${replace?'bad':''}"><div class="n">${replace}</div><div class="l">Tyres to replace now</div></div>
    <div class="stat ${soon?'warn':''}"><div class="n">${soon}</div><div class="l">Replace soon</div></div>
    <div class="stat"><div class="n">${unrec}</div><div class="l">Positions not recorded</div></div>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Vehicle</th><th>Type</th><th>Brand / model</th><th class="num">Odometer (km)</th><th>Last active</th><th>Alerts</th><th class="num">Tyres</th><th>Worst tyre</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- Inspect ---------- */
function renderInspect(){
  const types = TYPE_ORDER.map(k=>`<option value="${k}" ${state.type===k?'selected':''}>${TYPES[k].label}</option>`).join('');
  const vs = vehiclesSorted().filter(v=> !state.type || v.type===state.type);
  const vopts = vs.map(v=>`<option value="${esc(v.id)}" ${state.vehicleId===v.id?'selected':''}>${esc(v.name||'—')}${v.plate&&v.plate!==v.name?' · '+esc(v.plate):''}</option>`).join('');
  const v = store.vehicles.get(state.vehicleId);
  let diagram='', panel='';
  if(v && TYPES[v.type] && !positionsFor(v).length){
    diagram = `<div class="vname">${esc(v.name||'')}<span>${esc(typeLabel(v.type))}</span></div><div class="emptystate">${esc(typeLabel(v.type))} — this vehicle runs on tracks and has no tyres to record. If that's wrong, change its type under Edit vehicle.</div>`;
    panel = `<h2>${esc(v.name||'Vehicle')}</h2><p class="muted">${esc([v.brand,v.model].filter(Boolean).join(' '))}</p><dl class="kv"><dt>Odometer</dt><dd>${fmt(v.odometer)} km${v.odoSource?' <span class="muted">('+(v.odoSource==='can'?'CAN bus':'GPS')+')</span>':''}</dd><dt>Last active</dt><dd>${v.lastActive?esc(v.lastActive.slice(0,10)):'—'}</dd>${v.moveState?`<dt>Movement</dt><dd>${esc(v.moveState)}${standingDays(v)!=null?' for '+standingDays(v)+' day'+(standingDays(v)===1?'':'s'):''}</dd>`:''}</dl>${store.readOnly?'':`<div class="form-actions" style="justify-content:flex-start"><button class="btn sm" data-edit="${esc(v.id)}">Edit vehicle</button></div>`}`;
  } else if(v && TYPES[v.type]){
    const map=tyreMapOf(v.id);
    const al=vehicleAlerts(v);
    diagram = `<div class="vname">${esc(v.name||'')}<span>${esc(typeLabel(v.type))}${num(v.odometer)!=null?' · '+fmt(v.odometer)+' km':''}</span></div>
      ${al.filter(a=>a.k!=='notype').map(a=>`<div class="notice danger" style="margin:0 6px 10px">${esc(a.text)}</div>`).join('')}
      ${diagramSVG(v, map, state.pos, false)}
      ${legend()}`;
    panel = renderPanel(v, map);
  } else if(state.type){
    const ghost = {type:state.type, trailerAxles:TYPES[state.type].trailer?TYPES[state.type].trailer.def:0};
    diagram = positionsFor(ghost).length ? `<div class="vname">${esc(TYPES[state.type].label)}<span>layout</span></div>${diagramSVG(ghost,{},'',true)}${legend()}` : `<div class="emptystate">${esc(TYPES[state.type].label)} vehicles have no tyre positions.</div>`;
    panel = `<h2>Choose a vehicle</h2><p class="muted">This is the ${esc(TYPES[state.type].label.toLowerCase())} wheel layout with ${positionsFor(ghost).length} positions. Pick a vehicle to start recording its tyres.</p>${vs.length?'':`<p class="muted" style="margin-top:10px">No ${esc(TYPES[state.type].label.toLowerCase())}s in the fleet yet — add one from the Fleet tab, or set the type on an imported vehicle.</p>`}`;
  } else {
    diagram = `<div class="emptystate">Choose a vehicle type to see its wheel layout.</div>`;
    panel = `<h2>Start an inspection</h2><p class="muted">Pick the vehicle type, then the vehicle. Tap any tyre on the diagram to fit a new tyre there or record a tread-depth reading.</p>`;
  }
  return `
  <div class="viewhead"><div><h1>Inspect</h1><p class="sub">Tap a tyre on the diagram to record it</p></div></div>
  <div class="pickers">
    <div class="field"><label for="sel-type">Vehicle type</label><select id="sel-type"><option value="">All types</option>${types}</select></div>
    <div class="field"><label for="sel-vehicle">Vehicle</label><select id="sel-vehicle"><option value="">Choose a vehicle…</option>${vopts}</select></div>
  </div>
  <div class="inspect">
    <div class="diagram" id="diagram">${diagram}</div>
    <aside class="panel" id="panel">${panel}</aside>
  </div>`;
}
function legend(){
  return `<div class="legend">
    <span><i style="background:var(--good)"></i>Good</span><span><i style="background:var(--monitor)"></i>Monitor (50%+)</span>
    <span><i style="background:var(--soon)"></i>Replace soon (75%+)</span><span><i style="background:var(--replace)"></i>Replace now</span>
    <span><i class="empty"></i>Not recorded</span></div>`;
}

function renderPanel(v, map){
  const ro=store.readOnly;
  const ps=positionsFor(v);
  if(!state.pos){
    const ts=tyresOf(v.id);
    const counts = ['replace','soon','monitor','good'].map(s=>[s,ts.filter(t=>statusOf(t)===s).length]).filter(x=>x[1]);
    return `<h2>${esc(v.name||'Vehicle')}</h2>
      <p class="muted">${esc([typeLabel(v.type),v.brand,v.model].filter(Boolean).join(' · '))}</p>

function renderRegister(){
  const all=[...store.tyres.values()];
  const filt = state.regFilter;
  const list = all.filter(t=> filt==='all' ? t.status==='fitted' : statusOf(t)===filt);
  const vname = id => { const v=store.vehicles.get(id); return v? (v.name||'') : ''; };
  const chips = [['all','All fitted'],['replace','Replace now'],['soon','Replace soon'],['monitor','Monitor'],['good','Good'],['unrecorded','Not recorded'],['removed','Removed']]
    .map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${filt===k}">${l}</button>`).join('');
  const rows = sortBy(list, t=>{ const o={replace:0,soon:1,monitor:2,good:3,unrecorded:4,removed:5}; return o[statusOf(t)]*1e9 - (wearOf(t)||0); }).map(t=>{
    const v=store.vehicles.get(t.vehicleId||t.lastVehicleId);
    const st=statusOf(t), w=wearOf(t), km=kmRun(t,v), rem=remainingKm(t,v);
    return `<tr class="click" data-goto="${esc(t.vehicleId||'')}" data-gopos="${esc(t.position||'')}">
      <td><strong>${esc(t.serial||'—')}</strong><span class="small">${esc([t.brand,t.model].filter(Boolean).join(' '))}</span></td>
      <td>${esc(vname(t.vehicleId||t.lastVehicleId)||'—')}<span class="small">${esc(posLabel(v,t.position||t.lastPosition))}</span></td>
      <td>${esc(t.size||'—')}</td>
      <td class="num">${fmt(t.newDepth,1)} / ${fmt(t.lastDepth,1)}</td>
      <td class="num">${w==null?'—':fmt(w)+'%'}</td>
      <td class="num">${km==null?'—':fmt(km)}</td>
      <td class="num">${rem==null?'—':fmt(rem)}</td>
      <td><span class="badge ${st}">${STATUS[st].label}</span></td>
      <td>${esc(t.lastInspected||'—')}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="9"><div class="emptystate">${filt==='all'?'No tyres recorded yet. Go to Inspect, pick a vehicle and tap a wheel position.':'Nothing in this group.'}</div></td></tr>`;
  return `
  <div class="viewhead"><div><h1>Tyres</h1><p class="sub">${all.filter(t=>t.status==='fitted').length} fitted, ${all.filter(t=>t.status!=='fitted').length} removed</p></div>

  <div class="tablewrap"><table>
    <thead><tr><th>Tyre</th><th>Vehicle / position</th><th>Size</th><th class="num">New / now (mm)</th><th class="num">Worn</th><th class="num">km run</th><th class="num">Est. km left</th><th>Status</th><th>Inspected</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- Alerts ---------- */
function renderAlerts(){
  const vs=vehiclesSorted();
  const stat = vs.map(v=>({v,al:vehicleAlerts(v).filter(a=>a.k!=='notype')})).filter(x=>x.al.length);
  const notype = vs.filter(v=>!TYPES[v.type]);
  const fitted=[...store.tyres.values()].filter(t=>t.status==='fitted');
  const rep=fitted.filter(t=>statusOf(t)==='replace'), soon=fitted.filter(t=>statusOf(t)==='soon');
  const unrec = vs.map(v=>({v,n:positionsFor(v).length-tyresOf(v.id).length})).filter(x=>x.n>0);
  const vname=id=>{const v=store.vehicles.get(id);return v?(v.name||''):'';};
  const tyreRow = t => { const v=store.vehicles.get(t.vehicleId); return `<div class="alertrow" data-goto="${esc(t.vehicleId)}" data-gopos="${esc(t.position)}"><div class="main"><strong>${esc(vname(t.vehicleId))}</strong> · ${esc(posLabel(v,t.position))}<div class="small">${esc([t.serial,t.brand,t.size].filter(Boolean).join(' · '))} · ${fmt(t.lastDepth,1)} mm, ${fmt(wearOf(t))}% worn</div></div><span class="badge ${statusOf(t)}">${STATUS[statusOf(t)].label}</span></div>`; };
  const group = (title, items, html) => `<div class="alertgroup"><h2>${title}<span class="count">${items.length}</span></h2>${items.length?`<div class="alertlist">${html}</div>`:`<p class="muted">Nothing here.</p>`}</div>`;
  return `<div class="viewhead"><div><h1>Alerts</h1><p class="sub">What needs attention across the fleet</p></div></div>
  ${group(`Inactive or stationary ${STATIONARY_DAYS}+ days`, stat, stat.map(({v,al})=>`<div class="alertrow" data-goto="${esc(v.id)}"><div class="main"><strong>${esc(v.name||'')}</strong>${v.plate&&v.plate!==v.name?' · '+esc(v.plate):''}<div class="small">${esc(al.map(a=>a.text).join(' · '))}</div></div><span class="badge danger plain">${esc(typeLabel(v.type))}</span></div>`).join(''))}
  ${group('Tyres to replace now', rep, rep.map(tyreRow).join(''))}
  ${group('Tyres to replace soon', soon, soon.map(tyreRow).join(''))}
  ${group('Vehicles with no type set', notype, notype.map(v=>`<div class="alertrow" data-editv="${esc(v.id)}"><div class="main"><strong>${esc(v.name||'')}</strong>${v.plate&&v.plate!==v.name?' · '+esc(v.plate):''}<div class="small">Set the type so its wheel layout can be shown</div></div><span class="badge warn plain">Set type</span></div>`).join(''))}
  ${group('Positions not yet recorded', unrec, unrec.map(({v,n})=>`<div class="alertrow" data-goto="${esc(v.id)}"><div class="main"><strong>${esc(v.name||'')}</strong><div class="small">${n} of ${positionsFor(v).length} positions have no tyre recorded</div></div></div>`).join(''))}`;
}

  <div class="field" style="margin-top:12px"><input type="file" id="import-file" accept=".json,application/json"></div>

  <div class="form-actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary" id="btn-do-import" disabled>Import</button></div>`;

function flattenObj(d, parent='', out={}){
  for(const k of Object.keys(d)){ const key=parent?parent+'.'+k:k; const v=d[k];
    if(v && typeof v==='object' && !Array.isArray(v)) flattenObj(v,key,out); else if(Array.isArray(v)) out[key]=JSON.stringify(v); else out[key]=v; }
  return out;
}
function extractDevices(payload){
  const out=[];
  const push=(d,g)=>{ const r=flattenObj(d); if(g!=null) r._group=g; out.push(r); };
  if(Array.isArray(payload)){ payload.forEach(el=>{ if(el&&Array.isArray(el.items)) el.items.forEach(d=>d&&typeof d==='object'&&push(d, el.title||el.name)); else if(el&&typeof el==='object') push(el); }); }
  else if(payload && typeof payload==='object'){ for(const k of ['data','items','devices']) if(Array.isArray(payload[k])) return extractDevices(payload[k]); push(payload); }
  return out;
}
const ODO_HINTS=['odometer','odo','total_distance','distance','mileage'];
function renderImportMap(rows){
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const odoCands = cols.filter(c=>ODO_HINTS.some(h=>c.toLowerCase().includes(h)));
  const best = c => (c && cols.includes(c)) ? c : null;
  const s=store.settings;
  const pick = (saved, prefs) => best(saved) || prefs.map(p=>cols.find(c=>c.toLowerCase()===p)||cols.find(c=>c.toLowerCase().includes(p))).find(Boolean) || '';
  const sel = (name, val, list, allowNone) => `<select name="${name}">${allowNone?`<option value="">— none —</option>`:''}${list.map(c=>`<option value="${esc(c)}" ${c===val?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  const idF=pick(s.idField,['id','device_id']), nameF=pick(s.nameField,['name','title']), plateF=pick(s.plateField,['plate_number','plate','device_data.plate_number']), timeF=pick(s.timeField,['time','timestamp','dt_server','device_data.time']);
  const odoF = best(s.odoField) || odoCands.find(c=>c.toLowerCase()==='odometer') || odoCands.find(c=>c.toLowerCase().includes('odometer')) || odoCands[0] || '';
  const preview = rows.slice(0,5);
  $('#import-map').innerHTML = `
    <p style="margin:12px 0 6px">${rows.length} devices found. Check the field mapping:</p>
    <div class="formgrid">
      <div class="field"><label>Device id</label>${sel('idField',idF,cols)}</div>
      <div class="field"><label>Vehicle name</label>${sel('nameField',nameF,cols)}</div>
      <div class="field"><label>Plate</label>${sel('plateField',plateF,cols,true)}</div>
      <div class="field"><label>Last update time</label>${sel('timeField',timeF,cols,true)}</div>
      <div class="field"><label>Odometer</label>${sel('odoField',odoF,odoCands.length?odoCands:cols,true)}${odoCands.length?'':'<span class="hint">No obvious odometer field — pick one, or import without it.</span>'}</div>
      <div class="field"><label>Odometer unit</label><select name="odoUnit"><option value="km" ${s.odoUnit!=='m'?'selected':''}>km</option><option value="m" ${s.odoUnit==='m'?'selected':''}>metres</option></select></div>
    </div>
    <div class="preview"><table><thead><tr><th>Name</th><th>Odometer</th><th>Last update</th></tr></thead><tbody>
      ${preview.map(r=>`<tr><td>${esc(r[nameF])}</td><td>${esc(odoF?r[odoF]:'')}</td><td>${esc(timeF?r[timeF]:'')}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#btn-do-import').disabled=false;
}
async function doImport(){
  const g = n => { const el=$('#import-map [name="'+n+'"]'); return el?el.value:''; };
  const m={idField:g('idField'),nameField:g('nameField'),plateField:g('plateField'),timeField:g('timeField'),odoField:g('odoField'),odoUnit:g('odoUnit')};
  await store.saveSettings(m);
  let added=0, updated=0; const toWrite=[];
  const byTracker = new Map([...store.vehicles.values()].filter(v=>v.trackerId).map(v=>[String(v.trackerId),v]));
  for(const r of importParsed){
    const tid = String(r[m.idField] ?? '').trim(); if(!tid) continue;
    let v = byTracker.get(tid);
    const isNew = !v;
    if(isNew) v = { id:uid('v_'), trackerId:tid, type:'', source:'tracker', hasSpare:true, trailerAxles:0 };
    const name = r[m.nameField]; if(name!=null && name!=='') v.name=String(name);
    if(m.plateField && r[m.plateField]!=null && r[m.plateField]!=='') v.plate=String(r[m.plateField]);
    const when = m.timeField ? parseTrackerDate(r[m.timeField]) : null;
    if(when) v.lastActive=when;
    if(m.odoField){ let o=num(r[m.odoField]); if(o!=null){ if(m.odoUnit==='m') o=o/1000; o=Math.round(o); v.odometer=o; pushOdoHistory(v,o,when||undefined); } }
    if(r._group) v.group=String(r._group);
    if(isNew) added++; else updated++;
    toWrite.push(v);
  }
  await store.bulkWrite('vehicles', toWrite);
  closeModal();
  notice(`Imported ${added} new vehicle${added===1?'':'s'} and updated ${updated}.${added?' Set the type on new vehicles to see their wheel layouts.':''}`,'info');
}

/* ---------- CSV export ---------- */
function csv(rows){ return rows.map(r=>r.map(c=>{ const s=String(c??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\r\n'); }
async function exportTyres(){
  const rows=[['serial','vehicle','plate','position','brand','model','size','new_depth_mm','min_depth_mm','current_depth_mm','worn_pct','status','fitted_date','fitted_odo_km','vehicle_odo_km','km_run','est_remaining_km','cost_kes','cost_per_km','pressure_psi','condition','last_inspected','notes']];
  for(const t of store.tyres.values()){ const v=store.vehicles.get(t.vehicleId||t.lastVehicleId); const w=wearOf(t);
    rows.push([t.serial,v?v.name:'',v?v.plate:'',posLabel(v,t.position||t.lastPosition),t.brand,t.model,t.size,t.newDepth,t.minDepth,t.lastDepth,w==null?'':w.toFixed(1),STATUS[statusOf(t)].label,t.fittedDate,t.fittedOdo,v?v.odometer:'',kmRun(t,v)??'',remainingKm(t,v)==null?'':Math.round(remainingKm(t,v)),t.cost,costPerKm(t,v)==null?'':costPerKm(t,v).toFixed(2),t.lastPressure,t.condition,t.lastInspected,t.notes]); }
  await save(`tyre_register_${todayISO()}.csv`, csv(rows));
}
async function exportFleet(){
  const rows=[['vehicle','plate','vin','type','brand','model','odometer_km','odometer_source','last_active','days_since_active','movement','stationary_days','tyres_fitted','positions','worst_tyre','alerts']];
  for(const v of vehiclesSorted()){ const ts=tyresOf(v.id); rows.push([v.name,v.plate,v.vin||'',typeLabel(v.type),v.brand,v.model,v.odometer,v.odoSource||'',(v.lastActive||'').slice(0,10),daysSinceActive(v)??'',v.moveState||'',stationaryDays(v)??'',ts.length,positionsFor(v).length,worstStatus(ts)?STATUS[worstStatus(ts)].label:'',vehicleAlerts(v).map(a=>a.text).join('; ')]); }
  await save(`fleet_${todayISO()}.csv`, csv(rows));
}
async function save(filename, data){
  const blob=new Blob([data],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* =========================================================
   Events
   ========================================================= */
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button[data-view]'); if(!b) return; state.view=b.dataset.view; render(); window.scrollTo(0,0); });

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='sel-type'){ state.type=t.value; const v=store.vehicles.get(state.vehicleId); if(v && state.type && v.type!==state.type){ state.vehicleId=''; } state.pos=''; render(); }
  if(t.id==='sel-vehicle'){ state.vehicleId=t.value; state.pos=''; const v=store.vehicles.get(t.value); if(v&&v.type) state.type=v.type; render(); }
  if(t.id==='veh-type'){ const ax=$('#veh-axles'); const T=TYPES[t.value]; if(ax&&T) ax.value = T.trailer ? T.trailer.def : 0; }
  if(t.id==='import-file'){ const f=t.files&&t.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const p=JSON.parse(rd.result); importParsed=extractDevices(p); if(!importParsed.length) throw new Error('empty'); renderImportMap(importParsed); }catch(err){ $('#import-map').innerHTML=`<div class="notice danger" style="margin-top:10px">That file isn’t a tracker export the tool recognises. Use the devices_raw JSON from the fetch script.</div>`; } }; rd.readAsText(f); }
});
document.addEventListener('input', e=>{
  const f=e.target.closest('#form-fit'); if(!f) return;
  const nd=num(f.newDepth.value), md=num(f.minDepth.value), cd=num(f.lastDepth.value);
  const w = wearOf({newDepth:nd,minDepth:md,lastDepth:cd});
  const st = w==null?null:statusOf({status:'fitted',newDepth:nd,minDepth:md,lastDepth:cd});
  $('#fit-wear').innerHTML = w==null ? '' : `Wear now: <strong style="color:${STATUS[st].color}">${fmt(w)}%</strong> · <span class="badge ${st}">${STATUS[st].label}</span>`;
});

document.addEventListener('click', async e=>{
  const el=e.target;
  const q=s=>el.closest(s);
  if(q('[data-cancel]')){ closeModal(); if(q('#form-fit')){ state.pos=''; render(); } return; }
  if(q('#btn-add-vehicle')) return openModal(vehicleForm());
  if(q('#btn-import')) return openModal(importForm());
  if(q('#btn-do-import')) return doImport();
  if(q('#btn-export-tyres')) return exportTyres();
  if(q('#btn-export-fleet')) return exportFleet();
  if(q('#btn-sync')) return store.syncNow();
  if(q('#btn-disconnect')) return store.disconnect();
  if(q('#btn-odo')){ const v=store.vehicles.get(state.vehicleId); if(v) openModal(odoForm(v)); return; }
  const ed=q('[data-edit]'); if(ed){ e.stopPropagation(); const v=store.vehicles.get(ed.dataset.edit); if(v) openModal(vehicleForm(v)); return; }
  const edv=q('[data-editv]'); if(edv){ const v=store.vehicles.get(edv.dataset.editv); if(v) openModal(vehicleForm(v)); return; }
  const ins=q('[data-inspect]'); if(ins){ e.stopPropagation(); goto(ins.dataset.inspect,''); return; }
  const op=q('tr[data-open]'); if(op && !q('button')){ goto(op.dataset.open,''); return; }
  const gt=q('[data-goto]'); if(gt && !q('button')){ goto(gt.dataset.goto, gt.dataset.gopos||''); return; }
  const ch=q('.chip[data-filter]'); if(ch){ state.regFilter=ch.dataset.filter; render(); return; }
  const ty=q('.tyre[data-pos]'); if(ty && !ty.classList.contains('ghost')){ state.pos = (state.pos===ty.dataset.pos)?'':ty.dataset.pos; render(); return; }
  const it=q('#btn-inspect-tyre'); if(it){ const t=store.tyres.get(it.dataset.tid), v=store.vehicles.get(t.vehicleId); openModal(inspectionForm(t,v)); return; }
  const et=q('#btn-edit-tyre'); if(et){ openModal(editTyreForm(store.tyres.get(et.dataset.tid))); return; }
  const rt=q('#btn-remove-tyre'); if(rt){ const t=store.tyres.get(rt.dataset.tid), v=store.vehicles.get(t.vehicleId); openModal(removeForm(t,v)); return; }
  const dv=q('[data-delete-vehicle]'); if(dv){ const id=dv.dataset.deleteVehicle; const n=tyresOf(id).length; if(confirm(`Delete this vehicle${n?` and detach its ${n} fitted tyres`:''}? This can’t be undone.`)){ for(const t of tyresOf(id)){ t.status='removed'; t.lastVehicleId=id; t.lastPosition=t.position; t.vehicleId=''; t.position=''; t.removedDate=todayISO(); t.removalReason='Vehicle deleted'; await store.write('tyres',t); } await store.remove('vehicles',id); if(state.vehicleId===id){state.vehicleId='';state.pos='';} closeModal(); } return; }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('tyre')){ e.preventDefault(); e.target.click(); } });

function goto(vid,pos){ const v=store.vehicles.get(vid); if(!v) return; state.view='inspect'; state.vehicleId=vid; state.type=v.type||''; state.pos=pos||''; render(); window.scrollTo(0,0); }

document.addEventListener('submit', async e=>{
  const f=e.target; e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());
  if(f.id==='form-connect'){ store.connect((d.url||'').trim(), (d.token||'').trim()); return; }
  if(f.id==='form-vehicle'){
    const v = f.dataset.id ? {...store.vehicles.get(f.dataset.id)} : {id:uid('v_'), source:'manual'};
    v.name=d.name.trim(); v.plate=(d.plate||'').trim(); v.type=d.type; v.brand=(d.brand||'').trim(); v.model=(d.model||'').trim();
    v.trailerAxles=+d.trailerAxles||0; v.hasSpare=!!d.hasSpare;
    const o=num(d.odometer); if(o!=null && o!==v.odometer){ v.odometer=o; pushOdoHistory(v,o); } else if(o==null) delete v.odometer;
    if(d.lastActive){ const cur=(v.lastActive||'').slice(0,10); if(cur!==d.lastActive) v.lastActive=d.lastActive+'T12:00:00.000Z'; } else delete v.lastActive;
    await store.write('vehicles', v); closeModal();
    if(state.view==='inspect'){ state.vehicleId=v.id; state.type=v.type||''; render(); }
    return;
  }
  if(f.id==='form-odo'){
    const v={...store.vehicles.get(f.dataset.id)}; const o=num(d.odometer); if(o==null) return;
    v.odometer=o; pushOdoHistory(v,o,d.date?d.date+'T12:00:00.000Z':undefined); await store.write('vehicles',v); closeModal(); return;
  }
  if(f.id==='form-fit'){
    const v=store.vehicles.get(f.dataset.vid); if(!v) return;
    const by=(d.by||'').trim(); if(by) localStorage.setItem('asml_inspector',by);
    const t={ id:uid('t_'), status:'fitted', vehicleId:v.id, position:f.dataset.pos,
      serial:d.serial.trim(), size:(d.size||'').trim(), brand:(d.brand||'').trim(), model:(d.model||'').trim(),
      newDepth:num(d.newDepth), minDepth:num(d.minDepth), lastDepth:num(d.lastDepth), lastPressure:num(d.lastPressure),
      fittedDate:d.fittedDate||todayISO(), fittedOdo:num(d.fittedOdo), cost:num(d.cost), condition:d.condition, notes:(d.notes||'').trim(),
      lastInspected:todayISO(), inspections:[{date:todayISO(), odo:num(v.odometer), depth:num(d.lastDepth), pressure:num(d.lastPressure), condition:d.condition, notes:(d.notes||'').trim(), by}] };
    await store.write('tyres', t); return;
  }
  if(f.id==='form-insp'){
    const t={...store.tyres.get(f.dataset.tid)}; const v={...store.vehicles.get(t.vehicleId)};
    const by=(d.by||'').trim(); if(by) localStorage.setItem('asml_inspector',by);
    const rec={date:d.date||todayISO(), odo:num(d.odo), depth:num(d.depth), pressure:num(d.pressure), condition:d.condition, notes:(d.notes||'').trim(), by};
    t.inspections=[...(t.inspections||[]), rec].slice(-60);
    t.lastDepth=rec.depth; if(rec.pressure!=null) t.lastPressure=rec.pressure; t.lastInspected=rec.date; t.condition=rec.condition;
    await store.write('tyres', t);
    if(rec.odo!=null && v.id && (num(v.odometer)==null || rec.odo>v.odometer)){ v.odometer=rec.odo; pushOdoHistory(v,rec.odo,rec.date+'T12:00:00.000Z'); await store.write('vehicles',v); }
    closeModal(); return;
  }
  if(f.id==='form-edit-tyre'){
    const t={...store.tyres.get(f.dataset.tid)};
    Object.assign(t,{serial:d.serial.trim(),size:(d.size||'').trim(),brand:(d.brand||'').trim(),model:(d.model||'').trim(),newDepth:num(d.newDepth),minDepth:num(d.minDepth),fittedDate:d.fittedDate||'',fittedOdo:num(d.fittedOdo),cost:num(d.cost),notes:(d.notes||'').trim()});
    await store.write('tyres', t); closeModal(); return;
  }
  if(f.id==='form-remove'){
    const t={...store.tyres.get(f.dataset.tid)}; const v=store.vehicles.get(t.vehicleId);
    const odo=num(d.odo); const dep=num(d.depth);
    t.status='removed'; t.lastVehicleId=t.vehicleId; t.lastPosition=t.position; t.vehicleId=''; t.position='';
    t.removedDate=d.date||todayISO(); t.removedOdo=odo; t.removalReason=d.reason; if(dep!=null) t.lastDepth=dep;
    if(odo!=null && num(t.fittedOdo)!=null) t.totalKm=Math.max(0,odo-t.fittedOdo); else if(v) t.totalKm=kmRun({...t,status:'fitted',vehicleId:v.id},v);
    await store.write('tyres', t); closeModal(); state.pos=''; render(); return;
  }
});

/* boot */
setPill();
store.init();
